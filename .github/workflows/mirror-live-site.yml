name: Mirror current live portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-live-site.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LIVE_URL: https://project.isonu-x.chatgpt.site

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mirror dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Mirror deployed site
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urldefrag

          import requests
          from bs4 import BeautifulSoup

          BASE = os.environ['LIVE_URL'].rstrip('/') + '/'
          BASE_HOST = urlparse(BASE).netloc
          OUT = Path('live-site-export')
          if OUT.exists():
              shutil.rmtree(OUT)
          OUT.mkdir(parents=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (compatible; LiveSiteMirror/1.1)',
              'Accept': '*/*',
          })

          queue = deque([BASE])
          queued = {BASE}
          seen = set()
          manifest = []

          css_url_pat = re.compile(r'''url\((?:\s*["']?)([^"')]+)''', re.I)
          js_asset_pat = re.compile(r'''["']([^"']+\.(?:js|mjs|cjs|css|json|map|png|jpe?g|webp|gif|svg|ico|avif|woff2?|ttf|otf|eot|pdf)(?:\?[^"']*)?)["']''', re.I)

          def normalize(raw, parent):
              raw = (raw or '').strip()
              if not raw or raw.startswith(('data:', 'blob:', 'mailto:', 'tel:', 'javascript:', '#')):
                  return None
              try:
                  full = urljoin(parent, raw)
                  full, _ = urldefrag(full)
                  p = urlparse(full)
              except Exception:
                  return None
              if p.scheme not in ('http','https') or p.netloc != BASE_HOST:
                  return None
              return full

          def enqueue(raw, parent):
              u = normalize(raw, parent)
              if u and u not in queued:
                  queued.add(u)
                  queue.append(u)

          def local_path(url, content_type):
              p = urlparse(url)
              path = p.path or '/'
              if path.endswith('/'):
                  path += 'index.html'
              rel = path.lstrip('/') or 'index.html'
              dest = OUT / rel
              if not dest.suffix and 'text/html' in content_type:
                  dest = dest / 'index.html'
              return dest

          while queue:
              url = queue.popleft()
              if url in seen:
                  continue
              seen.add(url)
              try:
                  r = session.get(url, timeout=30, allow_redirects=True)
              except Exception as e:
                  print('FETCH ERROR', url, repr(e))
                  continue
              if r.status_code != 200:
                  print('SKIP', r.status_code, url)
                  continue

              final_url = r.url
              try:
                  final_host = urlparse(final_url).netloc
              except Exception:
                  continue
              if final_host != BASE_HOST:
                  print('REDIRECT OFF HOST', url, '->', final_url)
                  continue

              ctype = (r.headers.get('content-type') or '').split(';')[0].lower()
              dest = local_path(final_url, ctype)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(r.content)
              manifest.append({
                  'url': final_url,
                  'path': dest.as_posix(),
                  'sha256': hashlib.sha256(r.content).hexdigest(),
                  'bytes': len(r.content),
                  'content_type': ctype,
              })
              print('SAVED', final_url, '->', dest)

              text = None
              if ctype.startswith('text/') or ctype in {
                  'application/javascript','application/x-javascript','application/json',
                  'application/manifest+json','application/xml','image/svg+xml'
              }:
                  try:
                      text = r.text
                  except Exception:
                      text = None
              if text is None:
                  continue

              if 'html' in ctype:
                  soup = BeautifulSoup(text, 'html.parser')
                  for tag in soup.find_all(True):
                      for attr in ('src','href','poster','data-src'):
                          if tag.has_attr(attr):
                              enqueue(tag.get(attr), final_url)
                      if tag.has_attr('srcset'):
                          for item in tag.get('srcset','').split(','):
                              enqueue(item.strip().split(' ')[0], final_url)
                  for style in soup.find_all('style'):
                      for m in css_url_pat.findall(style.get_text()):
                          enqueue(m, final_url)
                  for script in soup.find_all('script'):
                      if not script.get('src'):
                          body = script.get_text() or ''
                          for m in js_asset_pat.findall(body):
                              enqueue(m, final_url)

              if 'css' in ctype:
                  for m in css_url_pat.findall(text):
                      enqueue(m, final_url)
                  for m in re.findall(r'''@import\s+(?:url\()?\s*["']?([^"')\s;]+)''', text, re.I):
                      enqueue(m, final_url)

              if 'javascript' in ctype or dest.suffix in {'.js','.mjs','.cjs'}:
                  for m in js_asset_pat.findall(text):
                      enqueue(m, final_url)

          Path('live-site-manifest.json').write_text(
              json.dumps(sorted(manifest, key=lambda x: x['path']), indent=2),
              encoding='utf-8'
          )
          print(f'Fetched {len(manifest)} deployed resources.')
          PY

      - name: Build ZIP of mirrored deployment
        run: |
          rm -f sonu-portfolio-live-deployment.zip
          (cd live-site-export && zip -qr ../sonu-portfolio-live-deployment.zip .)

      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonu-portfolio-live-deployment
          path: sonu-portfolio-live-deployment.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit mirrored deployed files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-site-export live-site-manifest.json sonu-portfolio-live-deployment.zip
          if git diff --cached --quiet; then
            echo 'No deployment changes detected.'
            exit 0
          fi
          git commit -m 'Mirror current live portfolio deployment'
          git push
